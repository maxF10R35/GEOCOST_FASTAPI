# Puertos del host elegidos para no chocar con otros proyectos: db 5433, api 8100, web (Vite) 5173
services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-geocost}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-geocost_dev}
      POSTGRES_DB: ${POSTGRES_DB:-geocost}
    ports: ["5433:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U geocost -d geocost"]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    build: ../backend
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-geocost}:${POSTGRES_PASSWORD:-geocost_dev}@db:5432/${POSTGRES_DB:-geocost}
      CORS_ORIGINS: '["http://localhost:5173"]'
    ports: ["8100:8000"]
    volumes:
      - ../backend:/app
      - ../legacy/data:/data/legacy:ro
      - ../datos:/data/raw:ro
    depends_on:
      db:
        condition: service_healthy
volumes:
  pgdata:
